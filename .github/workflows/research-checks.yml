name: Research reproduction checks

on:
  push:
    branches: [main, "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository evidence and deterministic outputs
        run: python scripts/verify_release.py
      - name: Run core tests
        run: python -m unittest discover -s tests -p 'test_audit.py' -v
