name: Research reproduction checks

on:
  push:
    branches: [main, "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build a fresh curated research snapshot
        run: python scripts/build_public_release.py --output /tmp/audit-the-auditor-ci
      - name: Verify snapshot manifest, trace census, and deterministic results
        run: python scripts/verify_release.py --root /tmp/audit-the-auditor-ci
      - name: Run core tests against the working tree
        run: python -m unittest discover -s tests -p 'test_audit.py' -v
